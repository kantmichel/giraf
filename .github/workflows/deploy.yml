name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same checks as on every other branch — defined once in test.yml.
  test:
    uses: ./.github/workflows/test.yml

  build-deploy-image:
    environment: DOKPLOY
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is baked in at build time: GitHub OAuth, NextAuth and the
      # database path are all read from the environment at runtime, so the same
      # image runs locally and on Dokploy.
      - name: Build and push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      # Skipped (not failed) until the Dokploy deployment webhook is configured.
      - name: Dokploy Deployment
        if: ${{ vars.DOKPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS "${{ vars.DOKPLOY_WEBHOOK_URL }}"
