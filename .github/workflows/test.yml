name: Test

# Runs lint, typecheck and build on every branch except main. Pushes to main
# are covered by deploy.yml, which calls this workflow (workflow_call) before
# it builds and deploys — so there is exactly one definition of "how it runs".

on:
  push:
    branches-ignore: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # See the note in the Dockerfile: build workers race over a file-backed
      # database, and the build reads nothing from it.
      DATABASE_PATH: ":memory:"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
